services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ₹{POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d base"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:₹{POSTGRES_PASSWORD}@db:5432/base
      SHIPPING_FEE: ₹{SHIPPING_FEE:-20.00}
      UPLOAD_DIR: /data/uploads
      PUBLIC_BASE_URL: ₹{PUBLIC_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: '₹{CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080"]}'
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
volumes:
  pgdata:
  uploads:
