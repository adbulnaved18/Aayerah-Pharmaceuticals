services:
  - type: web
    name: aayerah-api
    runtime: python
    rootDir: Base-forked/Base-forked/backend
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PRODUCT_IMAGES_BUCKET
        value: product-images
      - key: SUPABASE_PRIVATE_FILES_BUCKET
        value: private-documents
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["https://aayerah.com", "http://localhost:5173"]'
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MAX_IMAGE_BYTES
        value: "5242880"
      - key: SESSION_HOURS
        value: "24"
      - key: GEMINI_API_KEY
        sync: false
